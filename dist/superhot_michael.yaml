# SUPERHOT Archipelago player options.
#
# Copy this file, rename it, and change `name` if you want a second player/slot for
# testing with more than one person in the same room.
#
# See https://archipelago.gg/tutorial/Archipelago/setup/en for the general format if you
# want to add more players to the same YAML file, or check other games' options.

name: Michael
description: Sample player file for the SUPERHOT Archipelago world -- see TESTING.md.
game: SUPERHOT

requires:
  version: 0.5.0

SUPERHOT:
  progression_balancing:
    50: 50
  accessibility:
    full: true

  # How many of the other 31 story levels have to actually be completed before "34 -
  # Free" (the real ending) can be entered, even once its own Level Access item has
  # already been received -- see apworld/superhot/Options.py for the full explanation.
  # 0-31, defaults to 25. Set to 0 to disable this and let the access item alone be
  # enough, same as every other level.
  levels_required_for_free: 25
